<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100d22">
<title>Tweety Pop Deluxe — Vertical Slice v1.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
<header class="hud">
  <div class="badge">T</div>
  <div class="copy">
    <div class="title">Tweety Pop Deluxe</div>
    <div class="stats"><span>Score <b id="score">000000</b></span><span>Level <b id="level">1</b>/2</span></div>
  </div>
  <button id="soundBtn" class="small">Sound On</button>
  <button id="restartBtn">New Game</button>
</header>
<section class="stage">
<canvas id="game" width="480" height="760"></canvas>
<div id="overlay" class="overlay">
 <div class="panel">
  <h1 id="overlayTitle">Tweety Pop Deluxe</h1>
  <p id="overlayText">Vertical Slice v1.1<br>Two playable levels with sound, impact, falling eggs and game-feel physics.</p>
  <button id="startBtn">Start Game</button>
 </div>
</div>
</section>
<footer>Drag to aim • release to shoot • Match 3+ • Sound starts after tapping Start</footer>
</main>
<script src="game.js"></script>
</body></html>
